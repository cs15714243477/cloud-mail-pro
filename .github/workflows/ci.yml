name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            mail-vue/pnpm-lock.yaml
            mail-worker/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir mail-vue install --frozen-lockfile
      - name: Install Worker dependencies
        run: pnpm --dir mail-worker install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir mail-vue build
      - name: Run Worker unit tests
        run: pnpm --dir mail-worker exec vitest run --config vitest.unit.config.js
      - name: Check deployment scripts
        run: bash -n scripts/deploy.sh scripts/cf-bootstrap-domain.sh
