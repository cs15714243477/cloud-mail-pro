name = "cloud-mail-pro-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true

[dev]
ip = "127.0.0.1"

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true


[vars]
orm_log = false
domain = ["example.com", "example2.com", "example3.com", "example4.com"]
admin = "admin@example.com"
# jwt_secret is supplied through .dev.vars locally or Wrangler secrets remotely.
